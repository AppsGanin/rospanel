name: ci

# Quality gate for every push to main and every pull request: build the SPA,
# vet + build + race-test the Go code, lint it, and scan for known
# vulnerabilities. release-please.yml runs only after this passes on main, so a
# release is never cut from a commit these checks failed.
on:
  push:
    branches: [main]
  # release-please opens its PR as github-actions[bot], which GitHub treats as an
  # outside contributor: the run lands in "action required" and waits for a manual
  # click. Its PR only ever touches these three files, and that code already passed
  # ci on the push to main, so skipping it here keeps releases hands-off without
  # loosening the fork-PR approval policy that gates strangers. A PR touching any
  # other file still runs the full gate.
  pull_request:
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - internal/version/version.go

permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run (saves CI minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Merging the release PR pushes a commit that touches only the version, the
  # manifest and the changelog. Its checks are skipped — but the run itself still has
  # to happen and succeed: release-please.yml waits for exactly this run to tag the
  # release. The skip trusts the run before it, so it is taken only when all three
  # hold, and anything else gets the full gate:
  #   - only those three files changed;
  #   - every commit in the push is release-please's own (its release commit, or the
  #     merge of its branch) — a hand edit of version.go is code nothing has checked;
  #   - the commit underneath passed ci. A red, cancelled or missing run there means
  #     the code this merge would release was never proven, and skipping would tag it.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          full() { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = "push" ] || full
          # A new branch, a force push or a base this clone lacks: check everything.
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) full ;; esac
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || full
          other=$(git diff --name-only "$BEFORE" "$AFTER" |
            grep -vxE '\.release-please-manifest\.json|CHANGELOG\.md|internal/version/version\.go' || true)
          [ -n "$other" ] && full
          while read -r subject; do
            case "$subject" in
              "chore(main): release "*) ;;
              "Merge pull request #"*" from "*"/release-please--"*) ;;
              *) full ;;
            esac
          done < <(git log --format=%s "$BEFORE..$AFTER")
          passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$BEFORE&event=push&status=success" \
            --jq '.total_count' 2>/dev/null || echo 0)
          [ "${passed:-0}" -gt 0 ] || full
          echo "A release merge on a commit that passed ci: skipping the checks."
          echo "code=false" >> "$GITHUB_OUTPUT"

  # Build the SPA once and share web/dist with the Go jobs — the Go binary embeds
  # it via //go:embed, so every Go package fails to compile without dist present.
  # Skipped with it, the Go jobs below are skipped too: they all need it.
  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        working-directory: web
        run: npm ci
      # Lint before the build so a dead import or a form-submitting button fails the
      # job on its own line, instead of hiding inside a build log.
      - name: Lint SPA
        working-directory: web
        run: npm run lint
      - name: Build SPA
        working-directory: web
        run: npm run build
      - name: Upload dist (consumed by the Go jobs' go:embed)
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  go:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore embedded SPA
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # -race needs the default (CGO-enabled) toolchain; ubuntu-latest ships gcc.
      - name: go test (race)
        run: go test -race ./...

  lint:
    needs: frontend
    # The whole tree on a push to main — work lands there directly, and a lint job
    # that only ever ran on pull requests checked none of it; the tree is clean, so a
    # full run is also a fair one. On a pull request only the issues it adds block,
    # diffed against its base.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore embedded SPA
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          only-new-issues: ${{ github.event_name == 'pull_request' }}

  govulncheck:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Restore embedded SPA
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      # Scans against the live vuln DB, so it catches a newly-disclosed CVE even
      # with no code change — the guard that keeps the Go toolchain from silently
      # rotting (which is exactly how the pre-1.26.5 CVEs slipped in).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
