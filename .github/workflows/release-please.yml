name: release-please

# After every push to main that passes ci, release-please maintains a "release PR"
# that bumps the version + CHANGELOG from the Conventional Commits since the last
# release. Merging that PR tags the release (vX.Y.Z) and publishes a GitHub Release;
# the build jobs then attach the Linux binaries and push the image.
#
# It waits for ci rather than running beside it: a release cut from a commit whose
# checks later went red would ship exactly the change the gate exists to stop. Its own
# workflow, not jobs inside ci, because ci cancels a run when a newer push lands — and
# a release half-uploaded when that happens is a release without its binaries.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Only a ci run for a push to this repository's main that passed. A pull request
    # from a fork's own "main" branch also completes ci with head_branch main, and
    # this workflow holds write tokens — so the event and the repository are checked
    # too, not the branch alone.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag, not the default checkout: under workflow_run that is main's head at
      # the time this runs, which may already be a newer commit than the one released.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The Go binary embeds web/dist (embed.FS), so the frontend must be built first.
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build

      # Build both arches in one job so web/dist is compiled once and a single
      # SHA256SUMS holds every asset (parallel matrix jobs would race on --clobber).
      # Stripped (-s -w), as the Docker image already is: the symbol table and DWARF
      # are a quarter of the file and nothing reads them — a panic still prints its
      # stack, which comes from the runtime's own tables. Every panel downloads this
      # file on every update, so ~10 MB less is felt on each one.
      - name: Build binaries (linux/amd64 + linux/arm64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "rospanel-linux-$arch" ./cmd/rospanel/
          done

      # The self-updater verifies the downloaded binary against this file before
      # ever executing or swapping it in, so it must ship with every release. Each
      # arch gets its own "<hex>  <name>" line; the updater picks the one matching
      # its runtime.GOARCH.
      - name: Generate checksums
        run: sha256sum rospanel-linux-amd64 rospanel-linux-arm64 > SHA256SUMS

      - name: Attach binaries + checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" rospanel-linux-amd64 rospanel-linux-arm64 SHA256SUMS --clobber

  # Build the multi-arch Docker image and push it to GHCR on every release.
  build-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags: vX.Y.Z, X.Y, and latest (image name is lowercased).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
